plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.semi-project'
version = '0.0.1-SNAPSHOT'
description = 'pillbadeum-server'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

configurations {
    mockitoAgent
}

dependencies {
    // REST API
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    // 데이터베이스와 ORM
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // 입력값 검증
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // JWT 기반 로그인·인가
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

    // 상태 확인과 API 문서
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'

    // 벡터 검색(Qdrant). 기본은 꺼져 있고 QDRANT_ENABLED=true일 때만 연결한다.
    implementation 'io.qdrant:client:1.19.0'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Spring Boot 4의 테스트 의존성 구성은 프로젝트 예시를 따름
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    mockitoAgent('org.mockito:mockito-core') {
        transitive = false
    }
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs += "-javaagent:${configurations.mockitoAgent.asPath}"
}

// 키 값 출력·유료 호출·DB 변경 없이 현재 챗봇 설정의 누락 항목만 확인한다.
tasks.register('checkChatConfiguration', JavaExec) {
    group = 'verification'
    description = '챗봇 키·모델 설정 여부 점검 (외부 호출 없음)'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.semiproject.pillbadeumserver.chat.ChatConfigurationCli'
}

// 실제 API 연결은 일반 테스트와 분리한다. 합성 입력만 사용하며 DB를 변경하지 않는다.
tasks.register('tryChatProviders', JavaExec) {
    group = 'verification'
    description = '실제 OpenAI 또는 공공데이터의 명시적 연결 점검 (OpenAI 모드는 유료 호출)'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.semiproject.pillbadeumserver.chat.ChatProviderCli'
}
