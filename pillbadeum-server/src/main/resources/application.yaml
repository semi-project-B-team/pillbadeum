# 공통 설정. 개인 값은 환경변수로 받으며, local 프로필만 .env를 읽습니다.

spring:
  application:
    name: pillbadeum-server

  profiles:
    default: local

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    # 설명. 테이블은 sql/ 폴더의 DDL 로 만든다. (엔티티로 테이블을 자동 생성하지 않는다)
    hibernate:
      ddl-auto: none
    # 설명. 컨트롤러 · 뷰까지 DB 연결을 붙잡지 않는다. 지연 로딩은 서비스(@Transactional) 안에서 끝낸다.
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

  sql:
    init:
      mode: never

  jackson:
    time-zone: Asia/Seoul

  data:
    web:
      pageable:
        one-indexed-parameters: true

  threads:
    virtual:
      enabled: true

  # 설명. 이미지 업로드 크기 (알약 앞 · 뒤 2장을 한 번에 올리므로 요청 전체는 더 크게)
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 21MB

server:
  port: ${SERVER_PORT:8080}

# 설명. 업로드 파일 저장 위치 (프로젝트 바깥 폴더. Git 에 올라가지 않게)
file:
  upload:
    windows:
      path: ${FILE_UPLOAD_PATH_WINDOWS:C:/myWs/pillbadeum-uploads}
    mac:
      path: ${FILE_UPLOAD_PATH_MAC:/myWs/pillbadeum-uploads}

app:
  cors:
    # 설명. 프론트엔드 주소. 여러 개면 쉼표로 구분한다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

jwt:
  secret: ${JWT_SECRET:}
  # 1시간 (밀리초)
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000}

openai:
  api-key: ${OPENAI_API_KEY:}
  base-url: https://api.openai.com/v1
  model:
    chat: ${OPENAI_CHAT_MODEL:}
    vision: ${OPENAI_VISION_MODEL:}
    embedding: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
  # 설명. 모델이 지원하는 값만 쓴다. 추론 기능이 없는 모델이면 비워 둔다.
  reasoning-effort: ${OPENAI_REASONING_EFFORT:}
  connect-timeout-ms: 2000
  short-read-timeout-ms: 10000
  long-read-timeout-ms: 30000
  # 개발용 기본 상한. 실제 외부 API 한도와 팀 부하에 맞춰 조정합니다.
  max-concurrent-calls: ${OPENAI_MAX_CONCURRENT_CALLS:4}
  permit-timeout-ms: 1000

public-data:
  base-url: https://apis.data.go.kr
  # 설명. 공공데이터포털 마이페이지의 '일반 인증키(Decoding)' 값
  service-key: ${PUBLIC_DATA_SERVICE_KEY:}
  connect-timeout-ms: 2000
  read-timeout-ms: 5000
  max-concurrent-calls: ${PUBLIC_DATA_MAX_CONCURRENT_CALLS:4}
  permit-timeout-ms: 1000

# 설명. 복약 알림 웹 푸시(VAPID). 키가 비어 있으면 서버는 뜨고 푸시 API만 503. 개인 키는 .env에만 둔다.
web-push:
  vapid:
    public-key: ${VAPID_PUBLIC_KEY:}
    private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:}
  # 설명. 구독 주소로 허용할 브라우저 푸시 서비스. 점으로 시작하면 그 하위 주소 전체를 허용한다.
  allowed-hosts: ${WEB_PUSH_ALLOWED_HOSTS:fcm.googleapis.com,updates.push.services.mozilla.com,web.push.apple.com,.notify.windows.com}
  connect-timeout-ms: 2000
  read-timeout-ms: 5000
  ttl-seconds: 3600

# 설명. 벡터 검색(Qdrant). 기본은 꺼짐. Docker로 Qdrant를 띄운 사람만 .env에 QDRANT_ENABLED=true (README 4번)
qdrant:
  enabled: ${QDRANT_ENABLED:false}
  host: ${QDRANT_HOST:localhost}
  # 설명. gRPC 포트. 6333은 REST · 대시보드용이다.
  port: ${QDRANT_PORT:6334}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    tags-sorter: alpha

logging:
  # 로그 시각도 JVM 초기화 순서에 의존하지 않고 한국 시각으로 표시합니다.
  pattern:
    dateformat: yyyy-MM-dd'T'HH:mm:ss.SSSXXX,Asia/Seoul
    level: '%5p [requestId=%X{requestId:-}]'
  level:
    org.hibernate.SQL: info
    org.semiproject.pillbadeumserver: info
