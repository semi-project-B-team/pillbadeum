<!-- @dsCard group="Containers" height=380 subtitle="확인창 · 위험한 행동" -->
<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>Modal</title>
<style>
  body { margin: 0; min-height: 380px; background: var(--background-normal); font-family: var(--font-sans); }
  .mt-dim { padding-top: 40px; }
</style>
</head>
<body>
<div class="mt-dim">
  <section class="mt-modal" role="dialog" aria-modal="true" aria-labelledby="m-title" aria-describedby="m-text">
    <h2 class="mt-modal__title" id="m-title">이 일정을 삭제할까요?</h2>
    <p class="mt-modal__text" id="m-text">기간과 복용 시간을 모두 지워요. 약은 약 목록에 남아요.</p>
    <div class="mt-modal__actions">
      <button class="mt-btn mt-btn--assistive" type="button">취소</button>
      <button class="mt-btn mt-btn--danger" type="button">삭제</button>
    </div>
  </section>
</div>
</body>
</html>
