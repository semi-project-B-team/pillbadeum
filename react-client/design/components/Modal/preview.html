<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>Modal</title>

</style>
</head>
<body>
<div class="mt-dim">
  <div class="mt-modal" role="alertdialog" aria-modal="true" aria-labelledby="m-title" aria-describedby="m-text">

    <div class="mt-modal__actions">
      <button class="mt-btn mt-btn--assistive mt-btn--lg" type="button">취소</button>
      <button class="mt-btn mt-btn--danger mt-btn--lg" type="button">삭제</button>
    </div>
  </div>
</div>

</html>
