<!-- @dsCard height=288 -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>필받음 Pillbox</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--background-normal); color: var(--label-normal); font-family: var(--font-sans); overflow: hidden; }
  .cover { position: relative; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; }
  .brand { fill: var(--primary-normal); }
  .heavy { fill: var(--primary-heavy); }
  .tint { fill: var(--primary-weak-strong); }
  .deep { fill: var(--inverse-background); }
  .cut { fill: var(--background-normal); }
  .blk { rx: var(--radius-lg); }
  .tile { rx: var(--radius-chip); }
  .words { position: absolute; left: var(--space-24); bottom: var(--space-24); max-width: 440px; }
  .name { margin: 0; font-size: 96px; line-height: .95; font-weight: 700; letter-spacing: -0.03em; color: var(--label-normal); }
  .tag { margin: var(--space-12) 0 0 var(--space-4); font-size: 14px; line-height: 20px; letter-spacing: 0.0145em; color: var(--label-neutral); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      primary-normal 192×192 bled off the top (identity, largest) · primary-heavy 120×72 · primary-weak-strong 216×88 (the tint) · inverse-background 272×136 bleeding off the right — ≈35% of 960×288
  arrangement one tall green slab with a darker satellite under it; on the right a tint band over a deep card, bottoms on one line space-24 above the edge, space-16 gutters
  pattern     tiles, from "large 버튼과 카드 radius-lg, 칩 radius-chip, 칩 안쪽 space-8": UI-shaped tiles 24 tall at a space-8 gap, some merged two- and five-wide like chips and a button, green on the tint and cut out of the deep card, one green button-tile inside it
  scales      sides in space-8 multiples; gutters space-16; tile gap space-8; corners radius-lg on blocks, radius-chip on tiles
-->
<rect class="brand blk" x="16" y="-16" width="192" height="192" rx="12"/>
<rect class="heavy blk" x="16" y="192" width="120" height="72" rx="12"/>
<rect class="brand tile" x="152" y="208" width="56" height="24" rx="6"/>
<rect class="brand tile" x="152" y="240" width="24" height="24" rx="6"/>

<rect class="tint blk" x="224" y="24" width="216" height="88" rx="12"/>
<rect class="brand tile" x="240" y="40" width="56" height="24" rx="6"/>
<rect class="brand tile" x="304" y="40" width="24" height="24" rx="6"/>
<rect class="brand tile" x="336" y="40" width="24" height="24" rx="6"/>
<rect class="brand tile" x="368" y="40" width="56" height="24" rx="6"/>
<rect class="brand tile" x="240" y="72" width="24" height="24" rx="6"/>
<rect class="brand tile" x="272" y="72" width="24" height="24" rx="6"/>
<rect class="brand tile" x="304" y="72" width="56" height="24" rx="6"/>
<rect class="brand tile" x="368" y="72" width="24" height="24" rx="6"/>
<rect class="brand tile" x="400" y="72" width="24" height="24" rx="6"/>

<rect class="deep blk" x="224" y="128" width="272" height="136" rx="12"/>
<rect class="cut tile" x="240" y="144" width="56" height="24" rx="6"/>
<rect class="cut tile" x="304" y="144" width="24" height="24" rx="6"/>
<rect class="cut tile" x="336" y="144" width="88" height="24" rx="6"/>
<rect class="cut tile" x="240" y="176" width="24" height="24" rx="6"/>
<rect class="cut tile" x="272" y="176" width="56" height="24" rx="6"/>
<rect class="cut tile" x="336" y="176" width="24" height="24" rx="6"/>
<rect class="brand tile" x="240" y="224" width="152" height="24" rx="6"/>
</svg>
</div>
<div class="words">
<h1 class="name">필받음<br>Pillbox</h1>
<p class="tag">누를 곳에만 초록을, 나머지는 조용하게.</p>
</div>
</div>
</body>
</html>
