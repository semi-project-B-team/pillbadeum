<!-- @dsCard group="Status" height=300 subtitle="기본 · primary · 주의 · 오류 · 성공" -->
<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>Notice</title>
<style>
  body { margin: 0; padding: var(--space-16); background: var(--background-normal); font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: var(--space-12); }
  svg { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<div class="grid">
  <div class="mt-notice">
    <svg class="mt-notice__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>
    <div class="mt-notice__body"><p class="mt-notice__title">대화는 30일 동안 보관해요</p><p class="mt-notice__text">30일이 지난 대화는 자동으로 지워져요.</p></div>
  </div>
  <div class="mt-notice mt-notice--primary">
    <svg class="mt-notice__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg>
    <div class="mt-notice__body"><p class="mt-notice__title">올린 사진은 분석이 끝나면 바로 지워요</p><p class="mt-notice__text">찾은 약은 직접 확인한 뒤에만 저장돼요.</p></div>
  </div>
  <div class="mt-notice mt-notice--caution" role="status">
    <svg class="mt-notice__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/></svg>
    <div class="mt-notice__body"><p class="mt-notice__title">사진 인식은 틀릴 수 있어요</p><p class="mt-notice__text">이름과 용량이 약봉투와 같은지 꼭 확인해 주세요.</p></div>
  </div>
  <div class="mt-notice mt-notice--negative" role="alert">
    <svg class="mt-notice__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/></svg>
    <div class="mt-notice__body"><p class="mt-notice__title">이 약은 허가가 취하됐어요</p><p class="mt-notice__text">계속 먹어도 되는지 의사나 약사에게 먼저 확인하세요.</p></div>
  </div>
  <div class="mt-notice mt-notice--positive" role="status">
    <svg class="mt-notice__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>
    <div class="mt-notice__body"><p class="mt-notice__title">엄마의 약과 겹치지 않아요</p><p class="mt-notice__text">같은 약이 있으면 여기서 알려 드려요.</p></div>
  </div>
</div>
</body>
</html>
