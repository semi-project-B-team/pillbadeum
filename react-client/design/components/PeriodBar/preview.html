<!-- @dsCard group="Data display" height=230 subtitle="복용 달력 일정 막대 · 사람마다 색 · 끝난 일정" -->
<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>PeriodBar</title>
<style>
  body { margin: 0; padding: var(--space-16); background: var(--background-normal); font-family: var(--font-sans); }
  .cal { background: var(--background-elevated); border: 1px solid var(--line-normal); border-radius: var(--radius-xl); overflow: hidden; }
  .week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); padding: 0 0 8px; }
  .d { grid-row: 1; padding: 8px 12px; font-size: 15px; font-weight: 600; color: var(--label-normal); font-variant-numeric: tabular-nums; }
  .sun { color: var(--label-status-negative); }
</style>
</head>
<body>
<div class="cal">
<div class="week" aria-label="10월 11일부터 17일까지">
  <span class="d sun" style="grid-column: 1;">11</span><span class="d" style="grid-column: 2;">12</span><span class="d" style="grid-column: 3;">13</span><span class="d" style="grid-column: 4;">14</span><span class="d" style="grid-column: 5;">15</span><span class="d" style="grid-column: 6;">16</span><span class="d" style="grid-column: 7;">17</span>
  <a class="mt-period mt-period--p1 mt-period--cont-l mt-period--cont-r" href="#" style="grid-row: 2; grid-column: 1 / 8;"><b>김하나</b>&nbsp;로아큐탄연질캡슐</a>
  <a class="mt-period mt-period--p1 mt-period--past mt-period--cont-l" href="#" style="grid-row: 3; grid-column: 1 / 3;"><b>김하나</b>&nbsp;곰실린캡슐 · 끝남</a>
  <a class="mt-period mt-period--p2 mt-period--cont-r" href="#" style="grid-row: 4; grid-column: 4 / 8;"><b>엄마</b>&nbsp;노바스크정 5밀리그램</a>
</div>
</div>
</body>
</html>
