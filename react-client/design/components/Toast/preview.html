<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>Toast</title>
<style>
  body { margin: 0; padding: var(--space-24) var(--space-16); background: var(--background-alternative); font-family: var(--font-sans); display: flex; justify-content: center; }

</head>
<body>
<div class="mt-toast" role="status">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>
  <span>타이레놀정500밀리그람을 엄마의 약에 담았어요</span>
  <a class="mt-toast__action" href="#">복용 기간 정하기</a>

</html>
